name: Verify KT-87355 Compose BuildMetrics

on:
  push:
    branches:
      - test/KT-87355-ci
  workflow_dispatch:

jobs:
  compose-metrics-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable Git longpaths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Free disk space on Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 8
        id: jdk8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up JDK 11
        id: jdk11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up JDK 17
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run ComposeModuleMetricsTests (Linux)
        if: runner.os == 'Linux'
        env:
          JDK_1_8: ${{ steps.jdk8.outputs.path }}
          JDK_11_0: ${{ steps.jdk11.outputs.path }}
          JDK_17_0: ${{ steps.jdk17.outputs.path }}
        run: |
          ./gradlew :plugins:compose-compiler-plugin:compiler-hosted:integration-tests:test \
            --tests "androidx.compose.compiler.plugins.kotlin.ComposeModuleMetricsTests" \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -Xms512m -XX:+UseG1GC" \
            -Dkotlin.daemon.jvm.options="-Xmx2g -XX:+UseG1GC" \
            --stacktrace

      - name: Run ComposeModuleMetricsTests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JDK_1_8: ${{ steps.jdk8.outputs.path }}
          JDK_11_0: ${{ steps.jdk11.outputs.path }}
          JDK_17_0: ${{ steps.jdk17.outputs.path }}
        run: |
          .\gradlew.bat :plugins:compose-compiler-plugin:compiler-hosted:integration-tests:test `
            --tests "androidx.compose.compiler.plugins.kotlin.ComposeModuleMetricsTests" `
            --no-configuration-cache `
            --no-parallel `
            --max-workers=2 `
            '-Dorg.gradle.jvmargs=-Xmx4g -Xms512m -XX:+UseG1GC' `
            '-Dkotlin.daemon.jvm.options=-Xmx2g -XX:+UseG1GC' `
            --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            plugins/compose/compiler-hosted/integration-tests/build/test-results/
            plugins/compose/compiler-hosted/integration-tests/build/reports/tests/
          if-no-files-found: warn
